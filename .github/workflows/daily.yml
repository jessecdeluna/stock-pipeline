name: Daily pipeline

on:
  schedule:
    # 21:37 UTC, Mon-Fri = 4:37pm Central in summer / 3:37pm Central in winter, after the close.
    # GitHub often starts scheduled runs late (2-3 hours is common); data is still end-of-day.
    - cron: "37 21 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # lets the job commit the new warehouse files back to the repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      STOCKS_WAREHOUSE_DIR: warehouse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Run pipeline
        run: stock-pipeline --export-csv warehouse/latest.csv

      - name: Print today's snapshot to the job summary
        if: always()
        run: stock-query --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Commit new warehouse files
        if: always()   # also commit failed runs so pipeline_runs keeps the audit trail
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A warehouse/
          git diff --cached --quiet && echo "No changes" && exit 0
          DAY=$(stock-query --format plain "SELECT max(snapshot_date) FROM daily_quotes")
          git commit -m "Daily snapshot ${DAY}"
          git push
