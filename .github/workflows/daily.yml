name: Daily pipeline

on:
  schedule:
    # 21:37 UTC, Mon-Fri = 5:37pm ET in summer / 4:37pm ET in winter, after the 4pm close.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "37 21 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # lets the job commit the updated warehouse back to the repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      STOCKS_DB_PATH: warehouse/stocks.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Run pipeline
        run: stock-pipeline --export-csv warehouse/latest.csv

      - name: Print today's snapshot to the job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import duckdb, os

          def table(con, title, sql):
              rel = con.sql(sql)
              print(f"### {title}\n")
              print("| " + " | ".join(rel.columns) + " |")
              print("|" + "---|" * len(rel.columns))
              for row in rel.fetchall():
                  print("| " + " | ".join("" if v is None else str(v) for v in row) + " |")
              print()

          if os.path.exists("warehouse/stocks.duckdb"):
              con = duckdb.connect("warehouse/stocks.duckdb", read_only=True)
              table(con, "Latest run", "SELECT run_id, status, source, rows_loaded, issues "
                                       "FROM pipeline_runs ORDER BY started_at DESC LIMIT 1")
              table(con, "Latest snapshot", "SELECT snapshot_date, rank, ticker, open_price, "
                                            "avg_volume, pe_ratio FROM latest_quotes")
          EOF

      - name: Commit updated warehouse
        if: always()   # also commit failed runs so pipeline_runs keeps the audit trail
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warehouse/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
          git push
